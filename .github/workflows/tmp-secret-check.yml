name: TMP secret format check
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - env:
          WS: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
        run: |
          python3 - <<'PY'
          import os
          v = os.environ.get("WS", "")
          print("length:", len(v))
          print("starts with wrkspc_:", v.startswith("wrkspc_"))
          print("has whitespace/newline:", any(c.isspace() for c in v))
          print("has quotes:", any(c in "\"'`" for c in v))
          print("non-ascii:", any(ord(c) > 127 for c in v))
          print("prefix (first 4 chars):", v[:4])
          print("charset ok (alnum/_ only):", all(c.isalnum() or c == "_" for c in v))
          PY
