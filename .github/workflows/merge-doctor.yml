name: AI Merge Doctor
# pull_request_target (not pull_request): a PR with merge conflicts has no
# merge commit, and GitHub does not run pull_request workflows for it - which
# is exactly the case this workflow exists for. The scripts run from the base
# branch (checked out to _trusted); the PR branch is checked out separately and
# only Opus and the test suite touch it. The PR checkout keeps no push
# credentials: the trusted script pushes after verifying the result.
# Same-repo branches only, so a fork can never get its code run with secrets.
on:
  pull_request_target:
    types: [labeled]
jobs:
  merge-doctor:
    if: >-
      github.event.label.name == 'needs-expert-review' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: merge-doctor-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      pull-requests: write
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          path: _trusted
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: false
          path: pr
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install -g @anthropic-ai/claude-code
      - name: Install dependencies and browser for the test suite
        working-directory: pr
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Rebase, resolve, verify, push
        working-directory: pr
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: python ../_trusted/.github/scripts/run_merge_doctor.py
