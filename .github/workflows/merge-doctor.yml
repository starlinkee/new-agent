name: AI Merge Doctor
# pull_request_target (not pull_request): a PR with merge conflicts has no
# merge commit, and GitHub does not run pull_request workflows for it - which
# is exactly the case this workflow exists for. The workflow and scripts come
# from the base branch. PR code is only fetched to compute a text diff and is
# never executed or installed.
on:
  pull_request_target:
    types: [labeled]
jobs:
  merge-doctor:
    if: github.event.label.name == 'needs-expert-review'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Diff of the PR against its merge base
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          git fetch origin "pull/${PR_NUMBER}/head:pr-head"
          git diff "origin/${BASE_REF}...pr-head" > pr_diff.txt
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install anthropic
      - env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python .github/scripts/run_merge_doctor.py
